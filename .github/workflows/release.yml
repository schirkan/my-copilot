name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build portable bundle
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            . -> node_modules

      - name: Install npm dependencies (frontend)
        run: npm ci

      - name: Install tauri-cli
        shell: bash
        run: echo "@tauri-apps/cli is installed via npm ci"

      - name: Build frontend (tsc + vite)
        shell: bash
        run: cd "$GITHUB_WORKSPACE" && npm run build

      - name: Build Tauri app (produces MyCopilot.exe)
        shell: bash
        run: cd "$GITHUB_WORKSPACE/src-tauri" && npm exec --yes -- tauri build --no-bundle
        env:
          NODE_PATH: ${{ github.workspace }}

      - name: Locate Tauri build output
        shell: pwsh
        run: |
          $tauriDir = "src-tauri/target/release"
          Write-Host "Tauri build artifacts:"
          Get-ChildItem $tauriDir -Filter "my-copilot.exe" -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Assemble portable bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Locate the Tauri release binary
          $binary = Get-ChildItem "src-tauri/target/release/my-copilot.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $binary) {
            Write-Error "my-copilot.exe not found in src-tauri/target/release/"
            exit 1
          }
          Write-Host "Binary found at: $($binary.FullName)"

          # Create portable bundle
          $bundleName = "MyCopilot-portable-${{ github.ref_name }}"
          $bundlePath = "${{ github.workspace }}\$bundleName"
          if (Test-Path $bundlePath) {
            Remove-Item -Recurse -Force $bundlePath
          }
          New-Item -ItemType Directory -Path $bundlePath | Out-Null

          # Copy binary
          Copy-Item $binary.FullName "$bundlePath\MyCopilot.exe"

          # Seit SDK 1.0 + bundled-cli (Default-Feature seit 2026-07-26) ist
          # die Copilot-CLI als komprimiertes Archive in MyCopilot.exe
          # einkompiliert und wird vom SDK zur Laufzeit selbst entpackt.
          # Kein externer Sidecar (kein node/, kein copilot-cli/) mehr.

          # Create README
          @"
          # MyCopilot (portable build)

          Portable Build für Windows 11.

          ## Nutzung

          1. Doppelklick auf `MyCopilot.exe`
          2. Erstlauf-Dialog: Endpoint-URL + API-Key eingeben
          3. Save → `config.json` wird im exe-Verzeichnis geschrieben
          4. Chat-Layout erscheint

          ## Voraussetzungen

          - Windows 11 (WebView2 vorinstalliert)
          - Keine weitere Software nötig (Copilot CLI ist als bundled-cli ins
            Binary einkompiliert -- das github-copilot-sdk-Crate laedt sie
            zur Laufzeit selbst)

          ## Persistenz

          - `config.json` im exe-Verzeichnis (BYOK-Config, Klartext v1)
          - `data/sessions/*.jsonl` (Chat-History, eine Datei pro Session)

          ## Lizenz

          MIT — siehe LICENSE im Repository.
          "@ | Set-Content -Path "$bundlePath\README.txt" -Encoding UTF8

          # Create ZIP
          Compress-Archive -Path "$bundlePath\*" -DestinationPath "$bundleName.zip" -Force
          Write-Host "Bundle created: $bundleName.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: mycopilot-portable-bundle
          path: ${{ github.workspace }}/MyCopilot-portable-${{ github.ref_name }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/MyCopilot-portable-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
